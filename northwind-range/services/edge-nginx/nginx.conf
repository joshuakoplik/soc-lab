worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # SPEC.md §10 milestone 12 -- the exact json_ecs log_format the parent
    # soc-lab repo's own nginx.conf uses (verbatim field set), so
    # pipeline/normalize.py's normalize_nginx() can be reused unchanged by
    # normalize_northwind_nginx() (just correcting the source tag). Written
    # to the shared telemetry/ bind mount, tailed by pipeline/ingest.py
    # exactly like every other source there.
    log_format json_ecs escape=json
        '{'
          '"@timestamp":"$time_iso8601",'
          '"source":"northwind-nginx",'
          '"source_ip":"$remote_addr",'
          '"source_port":"$remote_port",'
          '"http_method":"$request_method",'
          '"url_path":"$uri",'
          '"url_query":"$args",'
          '"http_version":"$server_protocol",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"referer":"$http_referer",'
          '"user_agent":"$http_user_agent",'
          '"request_time":$request_time,'
          '"request_body":"$request_body"'
        '}';

    access_log  /app/telemetry/edge-nginx-access.json  json_ecs;

    server {
        listen 80;
        server_name _;

        location /health {
            return 200 "ok";
        }

        # portal-api reached through the same origin as chat-web -- keeps
        # its session cookie same-site with zero CORS configuration.
        # Prefix stripped: /api/auth/login -> portal-api:8000/auth/login.
        location /api/ {
            proxy_pass http://portal-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # /chat calls out to litellm/llm-backend and can legitimately
            # take a while -- same order of magnitude timeout as
            # llm-backend's own proxy_read_timeout.
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://chat-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
