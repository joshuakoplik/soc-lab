worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name _;

        location /health {
            return 200 "ok";
        }

        # portal-api reached through the same origin as chat-web -- keeps
        # its session cookie same-site with zero CORS configuration.
        # Prefix stripped: /api/auth/login -> portal-api:8000/auth/login.
        location /api/ {
            proxy_pass http://portal-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # /chat calls out to litellm/llm-backend and can legitimately
            # take a while -- same order of magnitude timeout as
            # llm-backend's own proxy_read_timeout.
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://chat-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
