name: northwind-range

# Milestone 1 skeleton (SPEC.md §13 step 1). Every custom service except
# edge-nginx/litellm is a /health-only stub -- real logic lands milestone by
# milestone per the build order. Network shape and the internal/host-port
# split are the part this milestone actually verifies (see
# scripts/verify-isolation.sh and scripts/verify-no-cves.sh).

services:
  edge-nginx:
    build: ./services/edge-nginx
    container_name: nw-edge-nginx
    networks:
      - nw_dmz
    volumes:
      - ./telemetry:/app/telemetry
    depends_on:
      chat-web:
        condition: service_healthy

  chat-web:
    build: ./services/chat-web
    container_name: nw-chat-web
    networks:
      - nw_dmz

  portal-api:
    # Repo-root context so the Dockerfile can COPY policy/ in alongside its
    # own code -- SPEC.md §7's shared policy module (see policy/policy.py).
    build:
      context: .
      dockerfile: services/portal-api/Dockerfile
    container_name: nw-portal-api
    networks:
      - nw_dmz
      - nw_app
    environment:
      DATABASE_URL: "postgresql://northwind:northwind-placeholder@postgres:5432/northwind"
      REDIS_URL: "redis://redis:6379/0"
      RETRIEVAL_SVC_URL: "http://retrieval-svc:8000"
      TOOL_SVC_URL: "http://tool-svc:8000"
      LITELLM_URL: "http://litellm:4000"
      LITELLM_MASTER_KEY: "sk-northwind-placeholder"
      LITELLM_MODEL: "qwen3-8b"
      INGEST_SVC_URL: "http://ingest-svc:8000"
    volumes:
      - ./telemetry:/app/telemetry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  litellm:
    build: ./services/litellm
    container_name: nw-litellm
    networks:
      - nw_app
    volumes:
      - ./services/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5

  llm-backend:
    build: ./services/llm-backend
    container_name: nw-llm-backend
    cap_add:
      - NET_ADMIN
    networks:
      - nw_app
      - nw_llm_egress
    # SPEC.md §0.1/§4: the one deliberate, narrow exception to "no egress" in
    # this whole range -- llm-backend forwards to an operator-controlled
    # remote Ollama host instead of running inference locally. See
    # entrypoint.sh for the iptables allow-list this depends on. Raw IP, not
    # a hostname -- nw_llm_egress has no reachable DNS resolver under that
    # same lockdown.
    environment:
      OLLAMA_UPSTREAM_HOST: "100.64.0.20"
      OLLAMA_UPSTREAM_PORT: "11434"

  retrieval-svc:
    # Repo-root context so the Dockerfile can COPY policy/ in -- same
    # reason as portal-api (SPEC.md §7's shared policy module).
    build:
      context: .
      dockerfile: services/retrieval-svc/Dockerfile
    container_name: nw-retrieval-svc
    networks:
      - nw_app
    environment:
      DATABASE_URL: "postgresql://northwind:northwind-placeholder@postgres:5432/northwind"
      LLM_BACKEND_URL: "http://llm-backend:11434"
      EMBED_MODEL: "embeddinggemma"
    volumes:
      - ./telemetry:/app/telemetry
    depends_on:
      postgres:
        condition: service_healthy

  tool-svc:
    # Repo-root context so the Dockerfile can COPY policy/ in -- same
    # reason as portal-api/retrieval-svc (SPEC.md §7's shared policy module).
    build:
      context: .
      dockerfile: services/tool-svc/Dockerfile
    container_name: nw-tool-svc
    networks:
      - nw_app
    environment:
      DATABASE_URL: "postgresql://northwind:northwind-placeholder@postgres:5432/northwind"
      RETRIEVAL_SVC_URL: "http://retrieval-svc:8000"
    volumes:
      - ./telemetry:/app/telemetry
    depends_on:
      postgres:
        condition: service_healthy

  ingest-svc:
    # Repo-root context so the Dockerfile can COPY telemetry_writer.py in --
    # SPEC.md §10 milestone 12's first shared-module dependency for this
    # service (never needed policy/ before now).
    build:
      context: .
      dockerfile: services/ingest-svc/Dockerfile
    container_name: nw-ingest-svc
    networks:
      - nw_app
    environment:
      DATABASE_URL: "postgresql://northwind:northwind-placeholder@postgres:5432/northwind"
      RETRIEVAL_SVC_URL: "http://retrieval-svc:8000"
      INGEST_POLL_INTERVAL_SECONDS: "20"
    volumes:
      - ./services/ingest-svc/watched:/app/watched
      - ./telemetry:/app/telemetry
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build: ./services/postgres
    container_name: nw-postgres
    cap_add:
      - NET_ADMIN
    networks:
      - nw_app
      - nw_ops
    environment:
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind-placeholder
      POSTGRES_DB: northwind
    volumes:
      - nw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "northwind"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: nw-redis
    networks:
      - nw_app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  harness:
    # Repo-root context so the Dockerfile can COPY policy/ in -- same
    # reason as portal-api/retrieval-svc/tool-svc (SPEC.md §7's shared
    # policy module; harness's scoring.py uses it as the layer-2 oracle).
    build:
      context: .
      dockerfile: harness/Dockerfile
    container_name: nw-harness
    cap_add:
      - NET_ADMIN
    networks:
      - nw_ops
      - nw_dmz
    environment:
      DATABASE_URL: "postgresql://northwind:northwind-placeholder@postgres:5432/northwind"
      PORTAL_API_URL: "http://portal-api:8000"
    volumes:
      # Read-only -- lets the runner derive each actor's real password the
      # same way scripts/seed_entitlements.py does (HMAC-SHA256(seed,
      # username)) and log in for real via /auth/login, rather than
      # needing Redis access (harness isn't on nw_app) or a session-forging
      # backdoor endpoint on portal-api.
      - ./.seed:/app/.seed:ro
      # Bind-mounted, not baked into the image at build time -- SPEC.md
      # §9.5's attack corpus is maintainer-supplied and updated out of
      # band; a rebuild shouldn't be required just to pick up new items.
      - ./corpus/attacks:/app/corpus/attacks:ro
      - ./corpus/benign:/app/corpus/benign:ro
      - ./telemetry:/app/telemetry
    depends_on:
      postgres:
        condition: service_healthy
    # The one operator port this whole range publishes (SPEC.md §0.2) --
    # 127.0.0.1 only, never 0.0.0.0. nw_dmz stays internal:true; harness's
    # leg on it reaches portal-api directly (milestone 11's runner) --
    # measuring the application, not edge-nginx's proxying (already
    # covered structurally by verify-chat.sh). nw_ops's leg is for the
    # published port plus direct postgres access (harness's own results
    # schema, and target resolution against app.* for scoring).
    ports:
      - "127.0.0.1:8090:8000"

networks:
  nw_dmz:
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1
  nw_app:
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.20.0/24
          gateway: 172.28.20.1
  nw_ops:
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.28.40.0/24
          gateway: 172.28.40.1
  # SPEC.md §0.1/§4: narrow, non-internal by design -- llm-backend's one
  # documented egress exception, not internal:true like every other network
  # in this range.
  nw_llm_egress:
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.28.50.0/24
          gateway: 172.28.50.1

volumes:
  nw-postgres-data:
