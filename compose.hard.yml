# Hard-mode override. Apply with (see lab-mode.sh, which wraps this):
#   docker compose -f compose.yaml -f compose.hard.yml up -d --force-recreate nginx juiceshop juiceshop-netlock
#
# Compose replaces list-valued keys (volumes, environment) wholesale when
# merging an override file, it does not patch individual entries -- so each
# overridden service repeats its FULL list here, not just the changed line.
#
# cowrie and metasploitable are NOT referenced here at all: they're gated by
# `profiles: ["easy"]` in compose.yaml itself, so hard mode just never starts
# them -- lab-mode.sh separately stops/removes them when switching.

services:
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/decoys-hard:/etc/nginx/decoys:ro

  juiceshop:
    environment:
      - CTF_KEY=${CTF_KEY}
      - NODE_ENV=hard
    volumes:
      - ./juiceshop/config/hard.yml:/juice-shop/config/hard.yml:ro
    # Hard mode's config (juiceshop/config/hard.yml) sets safetyMode: disabled,
    # which unlocks several DoS-shaped challenges (NoSQL DoS, XXE DoS, RCE DoS,
    # Memory Bomb). Capped so a solved one degrades this one container, not
    # the host running everything else.
    mem_limit: 512m
    cpus: 1.0

  # Shares juiceshop's network namespace (not its filesystem or process
  # tree) purely to apply an egress lockdown to it: loopback + the lab
  # subnet only, default DROP -- the same containment already applied to
  # soc-attacker, extended here because safetyMode: disabled unlocks
  # challenges that execute inside the juiceshop container itself.
  #
  # Installs iptables fresh every time this starts (the juiceshop image has
  # no package manager baked in, confirmed live -- no apt/apk, not even
  # `ls`/`cat` on PATH) then sleeps. The rules apply to the shared network
  # namespace and persist for as long as soc-juiceshop does, independent of
  # whether this sidecar container itself keeps running.
  juiceshop-netlock:
    image: alpine:latest
    container_name: soc-juiceshop-netlock
    network_mode: "container:soc-juiceshop"
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on: [juiceshop]
    restart: "no"
    command: >
      sh -c "
      apk add --no-cache iptables ip6tables >/dev/null &&
      iptables -F OUTPUT &&
      iptables -A OUTPUT -o lo -j ACCEPT &&
      iptables -A OUTPUT -d 10.211.0.0/24 -j ACCEPT &&
      iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT &&
      iptables -A OUTPUT -j DROP &&
      ip6tables -F OUTPUT &&
      ip6tables -A OUTPUT -o lo -j ACCEPT &&
      ip6tables -A OUTPUT -j DROP &&
      echo '[juiceshop-netlock] egress locked to 10.211.0.0/24' &&
      sleep infinity
      "
