# ulogd config for the perimeter firewall (PERIMETER_PLAN.md PR4).
#
# Reads NFLOG group 100 -- the perimeter's FW-ALLOW-THRU / FW-DENY-EXT rules
# (pipeline/firewall/perimeter.py) -- and writes LOGEMU-format firewall lines to
# a file Wazuh tails as /lab-logs/firewall/firewall.log. Runs inside
# soc-block-enforcer, the host-netns container that already owns the iptables
# rules; NFLOG needs only CAP_NET_ADMIN (which it has), unlike -j LOG which would
# need readable kernel logs this host doesn't provide (dmesg_restrict=1).
[global]
logfile="/var/log/ulogd.log"
loglevel=5

plugin="/usr/lib/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/ulogd/ulogd_filter_PRINTPKT.so"
plugin="/usr/lib/ulogd/ulogd_output_LOGEMU.so"

# NFLOG packet -> parse -> resolve iface names -> IPs to strings -> printable
# packet -> LOGEMU line. The nflog-prefix (FW-ALLOW-THRU/FW-DENY-EXT) rides
# through PRINTPKT into the emitted line, which is what the Wazuh decoder keys on.
stack=log1:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,print1:PRINTPKT,emu1:LOGEMU

[log1]
group=100

[emu1]
file="/lab-logs/firewall/firewall.log"
sync=1
