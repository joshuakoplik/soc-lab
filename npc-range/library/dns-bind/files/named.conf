// Minimal recursive resolver with query logging to stderr (picked up by the
// fleet tailer). Deliberately boring: a plausible internal DNS box.
options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    allow-query { any; };
    // Do not allow zone transfers by default (denials are a decodable event).
    allow-transfer { none; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

logging {
    channel stderr_log {
        stderr;
        severity info;
        print-time yes;
        print-category yes;
    };
    category queries { stderr_log; };
    category security { stderr_log; };
    category xfer-out { stderr_log; };
    category default { stderr_log; };
};
