# Cowrie loads cowrie.cfg.dist first, then this file as overrides.
# So we only need to state what differs from the defaults.

[honeypot]
# A plausible-looking hostname makes the shell session feel real to an attacker
# (and makes your demo screenshots better).
hostname = prod-web-01

# UserDB: only the credentials leaked via nginx/decoys/credentials.txt (see
# userdb.txt) actually work. Replaces AuthRandom's "accepts anything after a
# few tries" -- the point now is that a discovered leaked credential is the
# thing that grants access, not random chance.
auth_class = UserDB

# CTF flag plant (red-team agent exercise). contents_path only takes effect
# for paths that already exist in the filesystem pickle -- see [shell]
# filesystem below, which points at a copy of the shipped pickle with one
# new /root/flag.txt entry added. Without that pickle entry, dropping a file
# here alone would be invisible to `ls`/`cat` inside the honeypot.
contents_path = /cowrie/cowrie-git/honeyfs

[shell]
filesystem = /cowrie/cowrie-git/custom-fs.pickle

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4

[telnet]
# Off for now. One protocol is enough noise to start with.
enabled = false
