<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Lab — Live Defense Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="title-row">
    <h1>SOC Lab <span class="muted">/</span> Live Defense Console</h1>
    <div id="conn" class="conn-badge conn-down">connecting…</div>
  </div>
  <div id="stats" class="stats-row">
    <div class="stat-tile"><div class="stat-value" id="stat-eventrate">0</div><div class="stat-label">events / min</div></div>
    <div class="stat-tile"><div class="stat-value" id="stat-open-candidates">0</div><div class="stat-label">open candidates</div></div>
    <div class="stat-tile"><div class="stat-value" id="stat-alerts-1h">0</div><div class="stat-label">alerts (1h)</div></div>
    <div class="stat-tile"><div class="stat-value" id="stat-active-campaigns">0</div><div class="stat-label">active campaigns</div></div>
    <div class="stat-tile"><div class="stat-value" id="stat-flags">0</div><div class="stat-label">flags captured</div></div>
  </div>
</header>

<main class="page">
  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="defense" role="tab" aria-selected="true">Defender &amp; Attacker</button>
    <button class="tab-btn" data-tab="telemetry" role="tab" aria-selected="false">Live Telemetry</button>
  </div>

  <section class="panel tab-panel" id="panel-telemetry" data-tab="telemetry">
    <div class="panel-head">
      <h2>Live Telemetry</h2>
      <span class="panel-sub">raw events, as ingested</span>
    </div>
    <div class="feed" id="feed-events"></div>
  </section>

  <div class="split-row tab-panel active" data-tab="defense">
    <section class="panel" id="panel-defender">
      <div class="panel-head">
        <h2>Defender Log</h2>
        <span class="panel-sub">triage reasoning &middot; alerts &middot; block actions</span>
      </div>
      <div class="feed" id="feed-defender"></div>
    </section>

    <section class="panel" id="panel-attacker">
      <div class="panel-head">
        <h2>Attacker Campaigns</h2>
        <span class="panel-sub">red-team sessions against this lab</span>
      </div>
      <div class="feed" id="feed-attacker"></div>
    </section>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
