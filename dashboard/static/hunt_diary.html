<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Lab — Hunter Diary</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Diary-specific layout; leans on style.css for the base theme/colors. */
  .diary-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .diary-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  .diary-controls select { padding: 6px 8px; font: inherit; }
  .hunt-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 8px; font-size: 13px; opacity: .85; }
  .hunt-meta b { opacity: 1; }
  .outcomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 12px 0 22px; }
  .outcome-card { border: 1px solid rgba(128,128,128,.35); border-radius: 8px; padding: 10px 12px; }
  .outcome-card h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
  .turn { border: 1px solid rgba(128,128,128,.35); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  .turn-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; padding: 10px 14px;
               background: rgba(128,128,128,.10); border-bottom: 1px solid rgba(128,128,128,.25); }
  .turn-head .chunk-no { font-weight: 700; font-size: 15px; }
  .turn-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 820px) { .turn-cols { grid-template-columns: 1fr; } }
  .turn-col { padding: 12px 14px; }
  .turn-col.saw { border-right: 1px solid rgba(128,128,128,.25); }
  @media (max-width: 820px) { .turn-col.saw { border-right: none; border-bottom: 1px solid rgba(128,128,128,.25); } }
  .col-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin-bottom: 6px; }
  pre.board { white-space: pre-wrap; word-break: break-word; font-size: 11.5px; line-height: 1.35;
              max-height: 340px; overflow: auto; margin: 0; padding: 8px; border-radius: 6px;
              background: rgba(0,0,0,.18); }
  .note { margin: 0 0 8px; padding: 6px 8px; border-left: 3px solid rgba(128,128,128,.5); border-radius: 3px;
          background: rgba(128,128,128,.08); font-size: 13px; }
  .note .nt { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .7; margin-right: 6px; }
  .handoff { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: rgba(80,140,255,.10);
             border: 1px solid rgba(80,140,255,.30); font-size: 13px; }
  .handoff .next { display: block; margin-top: 6px; font-weight: 600; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .b-completed { background: rgba(60,180,90,.22); }
  .b-error { background: rgba(220,70,70,.25); }
  .b-running { background: rgba(230,180,40,.22); }
  .b-high, .b-critical { background: rgba(220,70,70,.25); }
  .b-medium { background: rgba(230,180,40,.22); }
  .b-low, .b-info { background: rgba(128,128,128,.20); }
  .muted { opacity: .6; }
  .empty { opacity: .6; font-style: italic; }
  a.back { text-decoration: none; opacity: .8; }
  a.back:hover { opacity: 1; }
</style>
</head>
<body>
<header id="topbar">
  <div class="title-row">
    <h1>SOC Lab <span class="muted">/</span> Hunter Diary</h1>
    <a class="back" href="/">&larr; live console</a>
  </div>
</header>

<div class="diary-wrap">
  <div class="diary-controls">
    <label for="hunt-select"><b>Hunt</b></label>
    <select id="hunt-select"></select>
    <span id="hunt-meta-inline" class="muted"></span>
  </div>
  <div id="outcomes" class="outcomes"></div>
  <div id="turns"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function sevClass(s) { return "b-" + (s || "").toLowerCase(); }
function fmtTokens(t) { if (!t || !t.total) return ""; return `${t.total.toLocaleString()} tok`; }
function fmtElapsed(s) { return s == null ? "" : `${Number(s).toFixed(1)}s`; }

async function load(huntId) {
  const q = huntId == null ? "" : `?hunt_id=${encodeURIComponent(huntId)}`;
  const data = await (await fetch(`/api/hunt-diary${q}`)).json();
  renderSelect(data.hunts, data.hunt);
  renderOutcomes(data);
  renderTurns(data.chunks || []);
}

function renderSelect(hunts, current) {
  const sel = $("hunt-select");
  sel.innerHTML = (hunts || []).map(h =>
    `<option value="${h.id}" ${current && h.id === current.id ? "selected" : ""}>` +
    `#${h.id} · ${esc(h.provider)}/${esc(h.model)} · ${esc(h.status)} · ${h.chunk_count} chunk(s)</option>`
  ).join("");
  const meta = $("hunt-meta-inline");
  meta.textContent = current ? `started ${current.started}${current.ended ? " · ended " + current.ended : ""}` : "";
}

function renderOutcomes(data) {
  const inc = data.incidents || [], leads = data.leads || [], acts = data.actions || {};
  const blocks = acts.block_ip_calls || [], pages = acts.human_pages || [], alerts = acts.agent_alerts || [];
  const cards = [];
  cards.push(`<div class="outcome-card"><h3>Incidents (${inc.length})</h3>` + (inc.length ? inc.map(i =>
    `<div style="margin-bottom:6px"><span class="badge ${sevClass(i.severity)}">${esc(i.severity)}</span> ` +
    `<b>#${i.id}</b> ${esc(i.title)} <span class="muted">(${esc(i.status)})</span>` +
    (i.hypothesis ? `<div class="muted" style="font-size:12px">${esc(i.hypothesis)}</div>` : "") + `</div>`
  ).join("") : `<span class="empty">none</span>`) + `</div>`);
  cards.push(`<div class="outcome-card"><h3>Response actions</h3>` +
    `<div>&#x26D4; blocks: <b>${blocks.length}</b>${blocks.map(b => ` · ${esc(b.src_ip || "")}`).join("")}</div>` +
    `<div>&#x1F4DF; pages: <b>${pages.length}</b></div>` +
    `<div>&#x1F6A8; alerts: <b>${alerts.length}</b></div>` + `</div>`);
  cards.push(`<div class="outcome-card"><h3>Leads (${leads.length})</h3>` + (leads.length ? leads.map(l =>
    `<div class="muted" style="font-size:12px">[${esc(l.status)}] ${esc(l.description)}</div>`).join("") :
    `<span class="empty">none</span>`) + `</div>`);
  $("outcomes").innerHTML = cards.join("");
}

function renderTurns(chunks) {
  if (!chunks.length) { $("turns").innerHTML = `<p class="empty">No turns recorded for this hunt yet.</p>`; return; }
  $("turns").innerHTML = chunks.map(c => {
    const notes = (c.notes || []).map(n =>
      `<div class="note"><span class="nt">${esc(n.note_type)}</span>${esc(n.body)}</div>`).join("");
    const cps = (c.checkpoints || []).map(cp =>
      `<div class="note"><span class="nt">checkpoint</span>${esc(cp.note)}</div>`).join("");
    let handoff = "";
    if (c.handoff) {
      handoff = `<div class="handoff">${esc(c.handoff.note)}` +
        (c.handoff.next_step ? `<span class="next">NEXT: ${esc(c.handoff.next_step)}</span>` : "") + `</div>`;
    }
    const reasoning = (notes || cps || handoff)
      ? (notes + cps + handoff)
      : `<span class="empty">No notebook entries or handoff for this turn${c.error ? " (turn errored before it could reason)" : ""}.</span>`;
    const err = c.error ? `<div class="note b-error" style="border-left-color:#d44">${esc(c.error)}</div>` : "";
    return `<div class="turn">
      <div class="turn-head">
        <span class="chunk-no">Turn ${c.chunk == null ? "?" : c.chunk}</span>
        <span class="badge b-${esc(c.status)}">${esc(c.status)}</span>
        <span class="muted">${esc(c.started || "")}</span>
        <span class="muted">${fmtElapsed(c.elapsed_s)}</span>
        <span class="muted">${fmtTokens(c.tokens)}</span>
      </div>
      <div class="turn-cols">
        <div class="turn-col saw">
          <div class="col-label">What the hunter saw (the board &amp; context this turn)</div>
          <pre class="board">${esc(c.board)}</pre>
        </div>
        <div class="turn-col did">
          <div class="col-label">What it reasoned &amp; did</div>
          ${err}${reasoning}
        </div>
      </div>
    </div>`;
  }).join("");
}

$("hunt-select").addEventListener("change", (e) => load(Number(e.target.value)));
load(null).catch(err => { $("turns").innerHTML = `<p class="empty">Failed to load diary: ${esc(err.message)}</p>`; });
</script>
</body>
</html>
