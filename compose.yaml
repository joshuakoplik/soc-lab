name: soc-lab

services:
  # --- Target 1: SSH honeypot. Clean JSON telemetry, attacker-controlled usernames.
  #     easy-mode only -- see lab-mode.sh. Not started at all in hard mode. ---
  cowrie:
    image: cowrie/cowrie:latest
    container_name: soc-cowrie
    restart: unless-stopped
    profiles: ["easy"]
    ports:
      # Host side only -- the container always listens on 2222 (cowrie.cfg).
      # LAB_BIND_IP / LAB_COWRIE_SSH_PORT come from .env; see .env.example.
      # NEVER map this to host port 22.
      - "${LAB_BIND_IP:-127.0.0.1}:${LAB_COWRIE_SSH_PORT:-2222}:2222"
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      # CTF flag plant. custom-fs.pickle is the shipped fs.pickle plus one new
      # /root/flag.txt directory-tree entry (content-less -- see honeyfs/
      # below); honeyfs/ supplies the actual bytes via [honeypot]
      # contents_path. Two separate mounts because Cowrie's own filesystem
      # model separates "does this path exist" (the pickle) from "what are
      # its bytes" (the honeyfs overlay) -- see cowrie/cowrie.cfg.
      - ./cowrie/custom-fs.pickle:/cowrie/cowrie-git/custom-fs.pickle:ro
      - ./cowrie/honeyfs:/cowrie/cowrie-git/honeyfs:ro
    networks: [soclab-easy]

  # --- Target 2: the web app, easy-mode variant. Not exposed directly; all
  #     traffic goes through nginx-easy. Split from a single shared
  #     "juiceshop" service (was toggled between configs via
  #     compose.hard.yml) into always-defined easy/hard services so both
  #     can run simultaneously instead of being mutually exclusive -- see
  #     pipeline/net_topology.py and lab-mode.sh's up/down-per-mode verbs. ---
  juiceshop-easy:
    image: bkimminich/juice-shop:latest
    container_name: soc-juiceshop-easy
    restart: unless-stopped
    profiles: ["easy"]
    expose:
      - "3000"
    environment:
      # Enables Juice Shop's native CTF mode -- flag values for each solved
      # challenge derive from this key rather than us inventing a separate
      # flag system. See README/pipeline docs for how the red-team agent
      # retrieves them.
      - CTF_KEY=${CTF_KEY}
    # aliases: [juiceshop] -- nginx/nginx.conf's upstream block hardcodes
    # "juiceshop" (the same shared config file is mounted into both
    # nginx-easy and nginx-hard), so whichever juiceshop variant lives on
    # the SAME network as a given nginx instance needs to answer to that
    # name too, same reasoning as nginx's own "nginx" alias below.
    networks:
      soclab-easy:
        aliases: [juiceshop]

  # --- Web telemetry source, easy-mode variant. ---
  nginx-easy:
    image: nginx:1.27-alpine
    container_name: soc-nginx-easy
    restart: unless-stopped
    profiles: ["easy"]
    depends_on: [juiceshop-easy]
    ports:
      # Defaults to 8082, not the more obvious 8080, which is commonly
      # already taken by something else on a dev box. Override with
      # LAB_NGINX_EASY_PORT in .env; see .env.example.
      - "${LAB_BIND_IP:-127.0.0.1}:${LAB_NGINX_EASY_PORT:-8082}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/decoys-easy:/etc/nginx/decoys:ro
    # aliases: [nginx] -- the red-team-agent-facing target name stays the
    # mode-agnostic "nginx" (see lab_modes.py's targets tuples, unchanged);
    # only the compose service key and container name are mode-specific.
    # soc-attacker is multi-homed onto every mode's network, so without a
    # per-network alias "nginx" would be ambiguous the moment more than one
    # mode is up at once -- see executor.py's resolve_target_ip(), which
    # resolves "nginx.soclab-easy" / "nginx.soclab-hard" explicitly instead
    # of a bare hostname for exactly this reason.
    networks:
      soclab-easy:
        aliases: [nginx]

  # --- Target 2, hard-mode variant: Juice Shop hardened (hints/tutorial
  #     off, safetyMode: disabled -- see juiceshop/config/hard.yml) and
  #     network-locked the same way soc-attacker is, via the
  #     juiceshop-netlock sidecar below (see its own comment for why this
  #     is still an iptables sidecar rather than a structural network
  #     property). ---
  juiceshop-hard:
    image: bkimminich/juice-shop:latest
    container_name: soc-juiceshop-hard
    restart: unless-stopped
    profiles: ["hard"]
    expose:
      - "3000"
    environment:
      - CTF_KEY=${CTF_KEY}
      - NODE_ENV=hard
    volumes:
      - ./juiceshop/config/hard.yml:/juice-shop/config/hard.yml:ro
    # Hard mode's config sets safetyMode: disabled, which unlocks several
    # DoS-shaped challenges (NoSQL DoS, XXE DoS, RCE DoS, Memory Bomb).
    # Capped so a solved one degrades this one container, not the host
    # running everything else.
    mem_limit: 512m
    cpus: 1.0
    networks:
      soclab-hard:
        aliases: [juiceshop]

  # Shares juiceshop-hard's network namespace (not its filesystem or process
  # tree) purely to apply an egress lockdown to it: loopback + the lab
  # subnet only, default DROP -- same reasoning as wordpress-netlock above
  # (soclab-hard is a normal, not internal:true, bridge -- see
  # pipeline/net_topology.py's bootstrap() for why), applied here because
  # safetyMode: disabled unlocks challenges that execute inside the
  # juiceshop container itself.
  #
  # Installs iptables fresh every time this starts (the juiceshop image has
  # no package manager baked in, confirmed live -- no apt/apk, not even
  # `ls`/`cat` on PATH) then sleeps. The rules apply to the shared network
  # namespace and persist for as long as soc-juiceshop-hard does, independent
  # of whether this sidecar container itself keeps running.
  juiceshop-netlock:
    image: alpine:latest
    container_name: soc-juiceshop-netlock
    profiles: ["hard"]
    network_mode: "container:soc-juiceshop-hard"
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on: [juiceshop-hard]
    restart: "no"
    command: >
      sh -c "
      apk add --no-cache iptables ip6tables >/dev/null &&
      iptables -F OUTPUT &&
      iptables -A OUTPUT -o lo -j ACCEPT &&
      iptables -A OUTPUT -d 10.211.20.0/24 -j ACCEPT &&
      iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT &&
      iptables -A OUTPUT -j DROP &&
      ip6tables -F OUTPUT &&
      ip6tables -A OUTPUT -o lo -j ACCEPT &&
      ip6tables -A OUTPUT -j DROP &&
      echo '[juiceshop-netlock] egress locked to 10.211.20.0/24' &&
      sleep infinity
      "

  # --- Web telemetry source, hard-mode variant. Published on a DIFFERENT
  #     host port (8081) than nginx-easy's 8082 -- two nginx instances
  #     can't share a host port when easy and hard coexist. ---
  nginx-hard:
    image: nginx:1.27-alpine
    container_name: soc-nginx-hard
    restart: unless-stopped
    profiles: ["hard"]
    depends_on: [juiceshop-hard]
    ports:
      # Must differ from LAB_NGINX_EASY_PORT -- two nginx instances cannot
      # share a host port when both modes are up. See .env.example.
      - "${LAB_BIND_IP:-127.0.0.1}:${LAB_NGINX_HARD_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./nginx/decoys-hard:/etc/nginx/decoys:ro
    networks:
      soclab-hard:
        aliases: [nginx]

  # --- Target 3: a real vulnerable Linux box, not an emulated honeypot. Real
  #     remote exploits (distccd, Samba usermap_script, the ingreslock
  #     backdoor, Tomcat manager default creds) and a real filesystem/kernel
  #     to escalate privileges on afterward -- what Cowrie's emulated shell
  #     and Juice Shop's app-level bugs can't offer. easy-mode only -- see
  #     lab-mode.sh. Not started at all in hard mode. ---
  metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: soc-metasploitable
    hostname: metasploitable
    restart: unless-stopped
    profiles: ["easy"]
    # The image's default CMD ("services.sh && bash") starts every classic
    # Metasploitable2 vulnerable service, then drops into an interactive
    # bash that exits on EOF with no tty attached -- taking the whole
    # container down with it, same problem the attacker service below solves
    # the same way. sleep infinity in place of bash keeps the
    # already-started services running indefinitely.
    command: ["sh", "-c", "/bin/services.sh && sleep infinity"]
    networks: [soclab-easy]
    # No ports published, no host bind, ever. This image is intentionally
    # and extensively vulnerable -- real backdoors (a root shell on the
    # ingreslock port), real RCE (distccd, Samba usermap_script, Tomcat
    # manager), unauthenticated MySQL/PostgreSQL/NFS. It must only ever be
    # reachable from soc-attacker over its own internal soclab-easy bridge,
    # same rule as Juice Shop and Cowrie's real sshd port, just with a much
    # sharper consequence if it were ever exposed.

  # --- Target 4: real WordPress core, pinned to the version vulnerable to
  #     CVE-2026-63030 (batch REST API logic flaw) chained with CVE-2026-60137
  #     (SQL injection in WP_Query) -- unauthenticated RCE. See
  #     wordpress/README.md for the vuln writeup and why auto-update has to be
  #     hard-disabled. Own profile, separate from easy/hard, same reasoning
  #     as legacy-svc: a single-target scenario isolating one specific
  #     vulnerability rather than a difficulty rung. Named plainly
  #     ("wordpress", not a codename hinting at the exploit chain) -- the
  #     product is obvious to any attacker who fingerprints it; the specific
  #     CVE pair it's pinned to should not be handed to the model for free. ---
  wordpress-db:
    image: mariadb:10.11
    container_name: soc-wordpress-db
    restart: unless-stopped
    profiles: ["wordpress"]
    environment:
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD_SECRET}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    volumes:
      - wordpress-db-data:/var/lib/mysql
    networks: [soclab-wordpress]

  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    image: soc-lab-wordpress:7.0.1-php8.3-apache-vuln
    container_name: soc-wordpress
    restart: unless-stopped
    profiles: ["wordpress"]
    depends_on: [wordpress-db]
    expose:
      - "80"
    environment:
      - WORDPRESS_DB_HOST=wordpress-db
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD_SECRET}
      # Hard-disable core auto-update. The real-world fix for this CVE pair
      # shipped via WordPress's forced auto-update push, so leaving this at
      # defaults would patch the target out from under the lab.
      # AUTOMATIC_UPDATER_DISABLED already covers that on its own (it kills
      # WP's whole background updater, core+plugins+themes+translations) --
      # deliberately not also setting DISALLOW_FILE_MODS, since that blocks
      # plugin installs entirely and would short-circuit the wp2shell chain's
      # RCE step (admin plugin upload) before it ever reaches auto-update.
      - WORDPRESS_CONFIG_EXTRA=define('WP_AUTO_UPDATE_CORE', false); define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - wordpress-html:/var/www/html
      # The php:apache base image symlinks access.log/error.log to
      # /dev/stdout//dev/stderr for docker-friendliness -- fine for `docker
      # logs`, invisible to Wazuh, which only reads real files. Bind-mounting
      # a host dir over /var/log/apache2 shadows those symlinks; Apache's
      # existing ErrorLog/CustomLog directives (unchanged) then just open
      # regular files there, same as cowrie/nginx already do for their logs.
      - ./logs/wordpress:/var/log/apache2
    networks: [soclab-wordpress]
    # No ports published -- reach it from soc-attacker as http://wordpress,
    # same no-host-exposure rule as every other intentionally-vulnerable
    # target in this lab.

  # One-shot wp-cli install: `wp core install` plus a second author and a
  # few posts (talks to the shared volume + DB directly, no HTTP needed).
  # Exits once done; restart: "no" so compose doesn't loop-restart it.
  wordpress-init:
    image: wordpress:cli-php8.3
    container_name: soc-wordpress-init
    profiles: ["wordpress"]
    restart: "no"
    depends_on: [wordpress, wordpress-db]
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      # wp-config.php reads these itself (getenv_docker(...) calls baked into
      # the file by the wordpress container's entrypoint) -- wp-cli needs the
      # same DB_* vars or it falls back to wp-config's own default host
      # ('mysql', which doesn't exist on this network) instead of wordpress-db.
      - WORDPRESS_DB_HOST=wordpress-db
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD_SECRET}
      - WP_ADMIN_USER=admin
      - WP_ADMIN_PASSWORD=${WORDPRESS_ADMIN_PASSWORD_SECRET}
      - WP_ADMIN_EMAIL=admin@wordpress.lab
      - WP_SITE_URL=http://wordpress
      - WP_SITE_TITLE=WordPress lab
    volumes:
      - wordpress-html:/var/www/html
      - ./wordpress/init.sh:/init.sh:ro
    networks: [soclab-wordpress]

  # Defense in depth on top of the auto-update constants above: soclab-wordpress
  # is a normal (not internal:true) bridge -- that flag was tried during this
  # refactor and reverted after confirming it also silently disables Docker's
  # own host port publishing for every container on the network, which broke
  # nginx's host-reachable ports elsewhere in this file. So wordpress still
  # needs its own explicit egress lock, same as before this refactor, just
  # pointed at wordpress's new subnet -- so it can't reach api.wordpress.org
  # (or anything else off-subnet) even if the in-app auto-update disable were
  # bypassed.
  wordpress-netlock:
    image: alpine:latest
    container_name: soc-wordpress-netlock
    profiles: ["wordpress"]
    network_mode: "container:soc-wordpress"
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on: [wordpress]
    restart: "no"
    command: >
      sh -c "
      apk add --no-cache iptables ip6tables >/dev/null &&
      iptables -F OUTPUT &&
      iptables -A OUTPUT -o lo -j ACCEPT &&
      iptables -A OUTPUT -d 10.211.30.0/24 -j ACCEPT &&
      iptables -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT &&
      iptables -A OUTPUT -j DROP &&
      ip6tables -F OUTPUT &&
      ip6tables -A OUTPUT -o lo -j ACCEPT &&
      ip6tables -A OUTPUT -j DROP &&
      echo '[wordpress-netlock] egress locked to 10.211.30.0/24' &&
      sleep infinity
      "

  # --- Real enforcement point for the defender's block_ip tool -----------
  # network_mode: host because inter-container traffic on any soclab-*
  # bridge is filtered through the HOST's netfilter DOCKER-USER chain --
  # Docker's own documented hook point for user-inserted container/bridge
  # filtering -- and a container on its own bridge netns can't reach that
  # chain at all. No profile: this is baseline defensive infra, up
  # regardless of which attacker-side lab mode(s) are active, same as
  # suricata/wazuh below.
  #
  # This container itself has full host-netns iptables power by virtue of
  # network_mode: host + NET_ADMIN -- the actual fence is one level up, in
  # pipeline/triage/block_enforcer.py: it is the ONLY caller that ever
  # execs into this container, and it only ever constructs rule shapes
  # scoped to a validated in-lab-subnet src_ip and the matching bridge
  # interface (see net_topology.py), never an arbitrary command. See
  # block_enforcer.py's docstring for the two-layer fence and reset.sh
  # --network to undo everything it's ever blocked.
  block-enforcer:
    image: alpine:latest
    container_name: soc-block-enforcer
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    command: >
      sh -c "
      apk add --no-cache iptables ip6tables >/dev/null &&
      echo '[block-enforcer] ready -- inserts DOCKER-USER rules scoped to soclab-* interfaces only' &&
      sleep infinity
      "

  # --- Network IDS. Watches every per-mode bridge; emits EVE JSON. ---
  suricata:
    image: jasonish/suricata:latest
    container_name: soc-suricata
    restart: unless-stopped
    # host netns so Suricata can see whichever soclab-*0 bridge interfaces
    # currently exist -- entrypoint.sh self-discovers all of them (see that
    # script) rather than watching one fixed interface, so a mode coming up
    # or down doesn't require restarting or reconfiguring this container.
    network_mode: host
    cap_add:
      - NET_ADMIN     # bring interfaces into promiscuous mode
      - NET_RAW       # raw packet capture
      - SYS_NICE      # thread priority for the worker threads
    # /bin/sh explicitly: the script does not need to be executable, which
    # survives the file being copied/pasted around.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      # NOT mounted over /etc/suricata/suricata.yaml — that REPLACES the
      # shipped config. entrypoint.sh merges this onto it instead.
      - ./suricata/overrides.yaml:/overrides.yaml:ro
      - ./suricata/entrypoint.sh:/entrypoint.sh:ro
      - ./logs/suricata:/var/log/suricata
      - suricata-rules:/var/lib/suricata/rules   # persist ET Open across restarts

  # --- The SIEM. Log-based detection: reads Cowrie + nginx + wordpress.
  # Manager ONLY. No indexer, no dashboard, no agents. The manager is the rules
  # engine; the indexer/dashboard are just storage and a UI, and our consumer is
  # ingest.py, not a human with a browser. That's what keeps this ~1GB instead
  # of the 8GB an all-in-one wants. ---
  wazuh:
    image: wazuh/wazuh-manager:4.14.6
    container_name: soc-wazuh
    restart: unless-stopped
    hostname: soc-wazuh
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 655360, hard: 655360 }
    environment:
      # Filebeat ships alerts to an indexer we don't run, so it will complain
      # in the logs forever. Harmless: analysisd writes alerts.json regardless,
      # and alerts.json is the only output we consume.
      - INDEXER_URL=disabled
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      # The manager image ships two built-in API accounts (wazuh, wazuh-wui)
      # with the same fixed default password out of the box, regardless of
      # whether the indexer/dashboard components this account naming is
      # meant for are actually deployed here (they aren't -- manager only,
      # see above). Confirmed live 2026-08-01: a red-team session logged in
      # to BOTH default accounts with zero effort and used the admin API's
      # own (legitimate, intended) remote-config-push feature to get root
      # command execution on this container. API_USERNAME/API_PASSWORD are
      # a first-class hook the image's own /etc/cont-init.d/2-manager boot
      # script reads (see create_user.py in the image): setting them
      # rewrites the NAMED account's password to this value AND randomizes
      # the *other* default account's password too (create_user.py's own
      # disable_user() loop), closing both holes in one step rather than
      # just the one being renamed. Runs on every container init -- no
      # persistent /var/ossec volume here, so this reapplies cleanly on
      # every force-recreate, same as the rest of this lab's reset story.
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD_SECRET}
    volumes:
      # Config goes to wazuh-config-mount, NOT straight onto /var/ossec/etc.
      # The image copies it into place at boot; bind-mounting over the live
      # path fights the entrypoint.
      - ./wazuh/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./wazuh/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml:ro
      # Our telemetry, read-only. Wazuh is a consumer here, not a producer.
      - ./logs:/lab-logs:ro
      # THE OUTPUT. alerts.json lands on the host for ingest.py to tail.
      - ./logs/wazuh:/var/ossec/logs/alerts
    # No network at all -- not even peer-reachable in a future
    # misconfiguration, since there's no bridge for anything to be added
    # to. Confirmed Wazuh needs zero network I/O here: no ports published,
    # INDEXER_URL=disabled (the one thing that would otherwise want
    # outbound reachability), and both its I/O paths above are host bind
    # mounts, not sockets. This replaced being on the same flat `soclab`
    # bridge as every target and the attacker -- a red-team session found
    # it purely by sweeping that shared bridge and rooted it via the
    # manager's own admin API using default credentials. See
    # pipeline/net_topology.py for the per-mode networks this and every
    # target now lives on instead.
    network_mode: none

  # --- The red team. Multi-homed onto every mode's network, always,
  #     regardless of which modes' target containers currently happen to
  #     be up -- an idle network with no other peers is harmless to stay
  #     attached to, and this avoids needing docker network connect/
  #     disconnect scripted into every lab-mode.sh call. Every packet still
  #     carries a TRUE container IP on whichever mode's segment it's
  #     talking on, which is what makes same_field and cross_source
  #     correlation mean something instead of everything looking like it
  #     came from the gateway.
  #
  #     No internet access by default -- reset.sh --attacker reapplies an
  #     iptables OUTPUT lockdown inside this container's own netns after
  #     every rebuild/recreate, one ACCEPT rule per lab subnet plus a
  #     default DROP (see reset.sh and attacker/README.md). This is the same
  #     approach the lab used before this refactor; `internal: true` on
  #     these networks was tried instead (structural, not
  #     reapply-after-every-recreate) and reverted after confirming live
  #     that it also silently disables Docker's own host port publishing
  #     for every container on the network, not just egress -- see
  #     pipeline/net_topology.py's bootstrap() docstring. The actual
  #     incident this refactor is downstream of (Wazuh reachable and
  #     rootable from the shared bridge) is fully closed by Wazuh's own
  #     network_mode: none above, independent of this. Deliberately
  #     opening real egress again (e.g. a bounded
  #     REDTEAM_UNRESTRICTED_EGRESS=1 experiment, see
  #     pipeline/redteam/agent.py) means not reapplying that lockdown, or
  #     explicitly punching a hole in it -- see attacker/README.md. ---
  attacker:
    # Built, not the bare image: the full attack toolkit (nmap, hydra,
    # sqlmap, metasploit, curl, python3, ...) is baked in at build time --
    # see attacker/Dockerfile -- since this container has no internet
    # access at runtime to fetch any of it once it's up.
    build: ./attacker
    image: soc-lab-attacker
    container_name: soc-attacker
    hostname: kali
    # Stay up idling so you can exec in. Without this the container runs its
    # command and exits.
    command: ["sleep", "infinity"]
    # Interactive tooling wants a tty.
    tty: true
    stdin_open: true
    cap_add:
      - NET_RAW        # nmap SYN scans, hping, anything crafting raw packets
      - NET_ADMIN
    volumes:
      # The attack scripts, and a place to drop loot/output back on the host.
      - ./attacker/scripts:/scripts:ro
      - ./attacker/loot:/loot
    networks: [soclab-easy, soclab-hard, soclab-wordpress, soclab-dealer]
    # No ports published. The attacker reaches whichever mode's targets are
    # up over that mode's bridge by service name (cowrie:2222, nginx:80,
    # wordpress:80); nothing is exposed to the host. Real internet access
    # is denied via this container's own iptables lockdown (see above and
    # reset.sh --attacker), not by these networks themselves -- they're
    # normal bridges, same as every Docker network unless told otherwise.

networks:
  # Created once by pipeline/net_topology.py's bootstrap() (see setup.sh /
  # lab-mode.sh), not by compose itself -- external: true means compose
  # only ever REFERENCES these by name, never creates/destroys them, so a
  # mode's containers stopping doesn't tear down the network underneath
  # Suricata or leave soc-attacker's multi-homing dangling. No CIDR/driver
  # config here at all -- Docker already knows the subnet/gateway/bridge
  # name from whenever bootstrap() created it; net_topology.py is the only
  # place that information lives. NOT internal: true -- see
  # net_topology.py's bootstrap() docstring for why that was tried and
  # reverted (it breaks Docker's own host port publishing).
  soclab-easy:
    external: true
  soclab-hard:
    external: true
  soclab-wordpress:
    external: true
  # The "dealer's choice" range's bridge (see dealer-range/, lab_modes.DEALER).
  # Also external + bootstrap-created, but net_topology creates THIS one with
  # --internal (structural no-egress for the untrusted live-fetched target,
  # which publishes no host ports -- so internal costs nothing here). soc-attacker
  # is multi-homed onto it above to reach `target`.
