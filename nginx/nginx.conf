user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # JSON access log. escape=json is doing real work here: it escapes
    # quotes/backslashes/control chars in attacker-controlled fields so a
    # hostile user-agent can't break out and forge log lines.
    #
    # Note what we capture: url_query, user_agent, referer, request_body.
    # All attacker-controlled. All eventually read by an LLM. That is the
    # Part 2 injection surface, captured deliberately.
    # ------------------------------------------------------------------
    log_format json_ecs escape=json
        '{'
          '"@timestamp":"$time_iso8601",'
          '"source":"nginx",'
          '"source_ip":"$remote_addr",'
          '"source_port":"$remote_port",'
          '"http_method":"$request_method",'
          '"url_path":"$uri",'
          '"url_query":"$args",'
          '"http_version":"$server_protocol",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"referer":"$http_referer",'
          '"user_agent":"$http_user_agent",'
          '"request_time":$request_time,'
          '"request_body":"$request_body"'
        '}';

    access_log  /var/log/nginx/access.json  json_ecs;

    # Second access log, classic combined format. Redundant to a human, load
    # bearing for the stack: Wazuh's shipped web_accesslog decoder parses
    # combined format, which activates its whole 31100-series web attack
    # ruleset. Our JSON log stays the source of truth for the pipeline.
    # Same events, two shapes, two consumers.
    access_log  /var/log/nginx/access.log   combined;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        # Decoy: a "misconfigured" backup directory with directory listing
        # left on, exposing what looks like a leaked-credentials export.
        # Deliberately discoverable via the same backup/config content
        # discovery attacker/scripts/attack-web.sh already probes ("backup"
        # is in its path wordlist). autoindex gives a small/local model a
        # real signal to work with -- an actual file listing, not just a
        # 200 it has to guess a filename against (Juice Shop's Angular SPA
        # returns 200 for nearly any path via client-side routing, so status
        # code alone barely distinguishes a real find from noise here).
        # Served directly by nginx -- never reaches Juice Shop.
        location = /backup {
            return 301 /backup/;
        }
        location /backup/ {
            alias /etc/nginx/decoys/;
            autoindex on;
        }

        location / {
            proxy_pass http://juiceshop:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
